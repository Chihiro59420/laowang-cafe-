<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 50%, #e1f5fe 100%);
      padding: 24px;
      overflow-x: hidden;
    }

    /* 粉彩漸層卡片 */
    .card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(255, 240, 245, 0.85));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(220, 180, 205, 0.3),
                  0 8px 16px rgba(180, 200, 240, 0.2),
                  inset 0 1px 2px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 52px rgba(220, 180, 205, 0.4),
                  0 12px 24px rgba(180, 200, 240, 0.25);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #7b61ff;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(123, 97, 255, 0.15);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #7b61ff 0%, #ff6b95 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }

    /* 精美發光按鈕 */
    .glow-btn {
      position: relative;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      background-size: 200% 200%;
      color: #3b3a58;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 24px rgba(255, 154, 158, 0.6),
                  0 0 45px rgba(161, 196, 253, 0.45),
                  0 6px 16px rgba(0, 0, 0, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      animation: gradientShift 6s ease infinite;
      user-select: none;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glow-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 35px rgba(255, 154, 158, 0.8),
                  0 0 60px rgba(161, 196, 253, 0.65),
                  0 10px 22px rgba(0, 0, 0, 0.12);
      color: #24223d;
    }

    .glow-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 0 18px rgba(255, 154, 158, 0.5),
                  0 0 30px rgba(161, 196, 253, 0.35);
    }

    /* 結果展示區 */
    .result-container {
      margin-top: 32px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .counter-badge {
      display: inline-block;
      background: rgba(123, 97, 255, 0.1);
      color: #6343e8;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(123, 97, 255, 0.2);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .counter-badge.bump {
      transform: scale(1.15);
    }

    .quote-box {
      font-size: 1.05rem;
      color: #4b4868;
      line-height: 1.6;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      border-left: 3px solid #ff9a9e;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      width: 100%;
    }

    .quote-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quote-box.initial {
      opacity: 0.65;
      transform: translateY(0);
      font-style: italic;
      color: #7d799d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-badge">✨ Antigravity Milestone</div>
    <h1>Antigravity 破冰成功！</h1>
    <button id="sparkleBtn" class="glow-btn">點我領取能量 🌟</button>

    <div class="result-container">
      <div id="clickCounter" class="counter-badge">已點擊 0 次</div>
      <div id="quoteDisplay" class="quote-box initial">點擊上方按鈕，接收今日專屬能量 ✨</div>
    </div>
  </div>

  <script>
    const quotes = [
      "保持好奇心，今天也是充滿無限可能的一天！",
      "一步一腳印，每個微小的努力都在累積未來的光芒！",
      "程式碼就像魔法，你正在親手創造不可思議的成果！",
      "放輕鬆、深呼吸，你比想像中的自己更優秀！",
      "探索新事物的勇氣，就是最棒的超能力！",
      "每一次敲打鍵盤，都是朝著夢想邁進的堅實腳步！",
      "今天遇到的任何挑戰，都會轉化為明天的養分！",
      "乾杯！祝你在 Antigravity 的冒險旅程順利又精彩！"
    ];

    let count = 0;
    let lastIndex = -1;

    const btn = document.getElementById("sparkleBtn");
    const counterEl = document.getElementById("clickCounter");
    const quoteEl = document.getElementById("quoteDisplay");

    btn.addEventListener("click", () => {
      // 增加計數
      count++;
      counterEl.textContent = `已點擊 ${count} 次`;

      // 計數器跳動動畫
      counterEl.classList.remove("bump");
      void counterEl.offsetWidth; // 強制重繪
      counterEl.classList.add("bump");

      // 隨機選取不重複的小語
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && randomIndex === lastIndex);
      lastIndex = randomIndex;

      // 更新小語內容與進場動畫
      quoteEl.classList.remove("initial", "visible");
      setTimeout(() => {
        quoteEl.textContent = quotes[randomIndex];
        quoteEl.classList.add("visible");
      }, 50);
    });
  </script>
</body>
</html>
